<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NI FITNESS</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
            padding: 20px;
        }

        .app {
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 15px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .card p {
            color: #777;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .button {
            background: #111;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 18px 10px;
            font-size: 15px;
            cursor: pointer;
        }

        .button:active {
            transform: scale(0.98);
        }
    </style>
</head>

<body>

<div class="app">

    <div class="header">
        <h1>NI FITNESS</h1>
        <p id="welcome">Личный кабинет</p>
    </div>

    <div class="card">
        <h2>Добро пожаловать 👋</h2>
        <p>
            Здесь будут твои тренировки, питание,
            показатели и прогресс.
        </p>
    </div>

    <div class="grid">

        <button class="button" onclick="openSection('training')">
            🏋️ Тренировки
        </button>

        <button class="button" onclick="openSection('nutrition')">
            🥗 Питание
        </button>

        <button class="button" onclick="openSection('progress')">
            📊 Прогресс
        </button>

        <button class="button" onclick="openSection('profile')">
            👤 Профиль
        </button>

    </div>

</div>

<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    if (user) {
        document.getElementById("welcome").innerText =
            "Привет, " + (user.first_name || "клиент") + " 👋";
    }

    function openSection(section) {

        if (section === "training") {
            alert("Раздел тренировок");
        }

        if (section === "nutrition") {
            alert("Раздел питания");
        }

        if (section === "progress") {
            alert("Раздел прогресса");
        }

        if (section === "profile") {
            alert("Профиль клиента");
        }

    }

</script>

</body>
</html>
