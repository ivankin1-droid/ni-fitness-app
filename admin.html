<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>Personal Coach · ADMIN</title>
<link rel="stylesheet" href="styles.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b0b0d;--card:#151518;--line:#2a2a2f;--muted:#8d8d95;--text:#f4f2ed}
.admin-main{max-width:980px;margin:0 auto;padding:16px}
.admin-hero{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin:8px 0 18px}
.admin-hero h1{margin:4px 0 2px;font-size:32px}.admin-hero p{margin:0;color:var(--muted)}
.admin-section{margin:18px 0 26px}
.admin-section-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:10px}
.admin-section-head h2{margin:4px 0 0;font-size:20px}
.admin-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin:8px 0 14px;scrollbar-width:none}
.admin-tabs::-webkit-scrollbar{display:none}
.admin-tab{flex:0 0 auto;border:1px solid var(--line);background:#111114;color:#aaa;border-radius:999px;padding:10px 13px;font-weight:700}
.admin-tab.active{background:#f1efe8;color:#101012;border-color:#f1efe8}
.admin-tab-panel{display:none}.admin-tab-panel.active{display:block}
#clientModal .sheet{max-width:760px;width:min(96vw,760px);max-height:92vh;overflow:auto}
#clientDetail>.profile-summary{position:sticky;top:0;z-index:2;background:rgba(21,21,24,.96);backdrop-filter:blur(10px);padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.admin-list{display:grid;gap:8px}
.admin-client{border-radius:16px}
.admin-tools input{width:100%;min-height:48px}
.notice button{margin-top:8px}
@media(min-width:760px){
  #clientList{grid-template-columns:repeat(2,minmax(0,1fr))}
  .admin-main{padding:24px}
}
</style>
</head>
<body>
<div class="admin-app">
<header class="topbar">
  <div class="brand"><div class="logo">PC</div><div><b>PERSONAL COACH · ADMIN</b><span>УПРАВЛЕНИЕ КЛИЕНТАМИ</span></div></div>
  <a class="icon-btn" href="/">К приложению</a>
</header>

<main class="admin-main">
  <section class="admin-hero">
    <div><span class="eyebrow">TRAINER CONTROL</span><h1>Клиенты</h1><p id="adminStatus">Проверяем права…</p></div>
  </section>

  <section class="admin-section">
    <div class="admin-tools"><input id="clientSearch" placeholder="Имя, username или Telegram ID"></div>
    <div id="clientList" class="admin-list"></div>
  </section>

  <section class="admin-section">
    <div class="admin-section-head">
      <div><span class="eyebrow">MONTHLY REVIEW</span><h2>Разборы месяца</h2></div>
    </div>
    <div id="reviewList" class="admin-list"></div>
  </section>
</main>
</div>

<div class="modal" id="clientModal">
  <div class="sheet"><button class="close">×</button><div id="clientDetail"></div></div>
</div>

<div class="modal" id="adminReviewModal">
  <div class="sheet"><button class="close">×</button><div id="adminReviewDetail"></div></div>
</div>

<script src="admin.js?v=11.0"></script>
</body>
</html>
